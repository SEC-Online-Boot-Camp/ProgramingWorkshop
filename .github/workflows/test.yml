# 教材のテストを、pushとプルリクエストのたびに自動で実行する
name: テスト

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  elixir:
    name: Elixirアプリ（${{ matrix.app }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - データベースの仕組み
          - 暗号解読ミッション/App
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      # 受講者のコード・SQLの実行に使う
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージの取得
        run: mix deps.get

      - name: コンパイル（警告もエラーにする）
        run: mix compile --warnings-as-errors

      - name: テスト
        run: mix test

  python:
    name: Pythonアプリ（${{ matrix.app }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - Webチャット
          - タスク管理
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージの導入
        run: python -m pip install -r requirements.txt

      # テストはapp.py（受講者が埋めるTODOあり）を確かめるので、完成版に差し替えて、答えが合っているかを確かめる
      - name: 完成版でテスト
        run: |
          cp app_complete.py app.py
          python -m pytest -q
