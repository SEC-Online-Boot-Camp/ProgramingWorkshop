L に ／ 同じ S が Z と Z と A に</text><text class="jp sub" x="98" y="672">同じ文字が別の文字に化けるので、数えても正体がつかめません（頻度分析が効かない）</text><rect x="64" y="754" width="1792" height="252" rx="26" fill="#F0FBFB" stroke="#00777A" stroke-width="4"/><text class="jp lead" x="98" y="804">解き方</text><circle cx="114" cy="853" r="19" fill="#2B3A42"/><text class="jp stepn" x="114" y="862" text-anchor="middle">1</text><text class="jp step" x="146" y="862">ずらしても、頻度を数えても解けないことを確かめる</text><circle cx="114" cy="915" r="19" fill="#2B3A42"/><text class="jp stepn" x="114" y="924" text-anchor="middle">2</text><text class="jp step" x="146" y="924">鍵は「単語」。心当たりのある言葉を入れて試す</text><circle cx="114" cy="977" r="19" fill="#2B3A42"/><text class="jp stepn" x="114" y="986" text-anchor="middle">3</text><text class="jp step" x="146" y="986">それでも分からなければ ── 生成AIに解読プログラムを作らせる</text></svg>
