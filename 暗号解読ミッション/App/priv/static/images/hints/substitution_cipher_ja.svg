ill="#FFFFFF" stroke="#C9D8DC" stroke-width="3"/><text class="jp" x="1525.0" y="211.8" text-anchor="middle" font-size="30" font-weight="700" fill="#2B3A42">K</text><rect x="1474" y="336" width="102" height="66" rx="18" fill="#FFF3D6" stroke="#FFC93C" stroke-width="3"/><text class="jp" x="1525.0" y="379.8" text-anchor="middle" font-size="30" font-weight="700" fill="#2B3A42">A</text><path d="M1525.0,238 C1515.0,276 1535.0,300 1525.0,332" stroke="#FF7757" stroke-width="3.5" fill="none" opacity="0.85"/><rect x="1600" y="168" width="102" height="66" rx="18" fill="#FFFFFF" stroke="#C9D8DC" stroke-width="3"/><text class="jp" x="1651.0" y="211.8" text-anchor="middle" font-size="30" font-weight="700" fill="#2B3A42">L</text><rect x="1600" y="336" width="102" height="66" rx="18" fill="#FFF3D6" stroke="#FFC93C" stroke-width="3"/><text class="jp" x="1651.0" y="379.8" text-anchor="middle" font-size="30" font-weight="700" fill="#2B3A42">S</text><path d="M1651.0,238 C1658.0,276 1644.0,300 1651.0,332" stroke="#FF7757" stroke-width="3.5" fill="none" opacity="0.85"/><rect x="1726" y="168" width="102" height="66" rx="18" fill="#FFFFFF" stroke="#C9D8DC" stroke-width="3"/><text class="jp" x="1777.0" y="211.8" text-anchor="middle" font-size="30" font-weight="700" fill="#2B3A42">M</text><rect x="1726" y="336" width="102" height="66" rx="18" fill="#FFF3D6" stroke="#FFC93C" stroke-width="3"/><text class="jp" x="1777.0" y="379.8" text-anchor="middle" font-size="30" font-weight="700" fill="#2B3A42">D</text><path d="M1777.0,238 C1768.0,276 1786.0,300 1777.0,332" stroke="#FF7757" stroke-width="3.5" fill="none" opacity="0.85"/><text class="jp cap" x="214" y="428">… 対応はA〜Zの26文字ぶん、すべてバラバラです</text><rect x="64" y="470" width="880" height="120" rx="24" fill="#E8EDEF" stroke="#2B3A42" stroke-width="4"/><text class="jp lead" x="98" y="524">組み合わせは 26! ≒ 4×10²⁶ 通り</text><text class="jp sub" x="98" y="566">総当たりでは、いつまでも終わりません</text><text class="jp cap" x="64" y="656">でも、英語の文章には強い偏りがあります</text><text class="mono" x="70" y="712" font-size="30" font-weight="700" fill="#2B3A42">E</text><rect x="116" y="684" width="560" height="34" rx="8" fill="#00A5A8"/><text class="jp t" x="694" y="712">12.7%</text><text class="mono" x="70" y="764" font-size="30" font-weight="700" fill="#2B3A42">T</text><rect x="116" y="736" width="401" height="34" rx="8" fill="#00A5A8"/><text class="jp t" x="535" y="764">9.1%</text><text class="mono" x="70" y="816" font-size="30" font-weight="700" fill="#2B3A42">A</text><rect x="116" y="788" width="362" height="34" rx="8" fill="#00A5A8"/><text class="jp t" x="496" y="816">8.2%</text><text class="mono" x="70" y="868" font-size="30" font-weight="700" fill="#2B3A42">O</text><rect x="116" y="840" width="331" height="34" rx="8" fill="#00A5A8"/><text class="jp t" x="465" y="868">7.5%</text><text class="mono" x="70" y="920" font-size="30" font-weight="700" fill="#2B3A42">I</text><rect x="116" y="892" width="309" height="34" rx="8" fill="#00A5A8"/><text class="jp t" x="443" y="920">7.0%</text><text class="mono" x="70" y="972" font-size="30" font-weight="700" fill="#2B3A42">N</text><rect x="116" y="944" width="295" height="34" rx="8" fill="#00A5A8"/><text class="jp t" x="429" y="972">6.7%</text><text class="jp sub" x="64" y="1026">最頻出の3文字の単語は <tspan class="mono" font-weight="700">THE</tspan></text><rect x="1004" y="470" width="852" height="376" rx="26" fill="#F0FBFB" stroke="#00777A" stroke-width="4"/><text class="jp lead" x="1038" y="520">解き方</text><circle cx="1054" cy="569" r="19" fill="#2B3A42"/><text class="jp stepn" x="1054" y="578" text-anchor="middle">1</text><text class="jp step" x="1086" y="578">暗号文の文字が何回出るかを数える</text><circle cx="1054" cy="631" r="19" fill="#2B3A42"/><text class="jp stepn" x="1054" y="640" text-anchor="middle">2</text><text class="jp step" x="1086" y="640">一番多い文字を E と仮定してみる</text><circle cx="1054" cy="693" r="19" fill="#2B3A42"/><text class="jp stepn" x="1054" y="702" text-anchor="middle">3</text><text class="jp step" x="1086" y="702">何度も出る3文字の語を THE と仮定</text><circle cx="1054" cy="755" r="19" fill="#2B3A42"/><text class="jp stepn" x="1054" y="764" text-anchor="middle">4</text><text class="jp step" x="1086" y="764">分かった文字を全文に当てはめる</text><circle cx="1054" cy="817" r="19" fill="#2B3A42"/><text class="jp stepn" x="1054" y="826" text-anchor="middle">5</text><text class="jp step" x="1086" y="826">読めそうな単語から芋づる式に埋める</text></svg>
