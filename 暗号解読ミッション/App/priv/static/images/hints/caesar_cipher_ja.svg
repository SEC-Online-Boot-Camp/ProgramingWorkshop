<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="50音のシーザー暗号の解き方。全ての文字を同じ数だけずらす仕組みと、鍵の見つけ方。"><style>
  .jp { font-family: "BIZ UDPGothic","BIZ UDGothic","Hiragino Sans","Yu Gothic",sans-serif; }
  .mono { font-family: "Cascadia Mono","Consolas","BIZ UDGothic",monospace; }
  .h    { font-size: 34px; font-weight: 700; fill: #2B3A42; }
  .lead { font-size: 30px; font-weight: 700; fill: #2B3A42; }
  .sub  { font-size: 26px; fill: #45575F; }
  .cap  { font-size: 24px; fill: #6B7D85; }
  .t    { font-size: 27px; font-weight: 700; fill: #00777A; }
  .c    { font-size: 27px; font-weight: 700; fill: #D9542B; }
  .tag  { font-size: 25px; font-weight: 700; fill: #FFFFFF; }
  .step { font-size: 29px; fill: #2B3A42; }
  .stepn{ font-size: 26px; font-weight: 800; fill: #FFC93C; }
</style><rect width="1920" height="1080" rx="34" fill="#FFFDF5"/><rect x="64" y="56" width="340" height="52" rx="26" fill="#00A5A8"/><text class="jp tag" x="234.0" y="90" text-anchor="middle">50音のシーザー暗号</text><text class="jp h" x="432" y="92">すべての文字を、<tspan fill="#FF7757">同じ数だけ</tspan> ずらしている</text><text class="jp cap" x="64" y="176">50音の並び（全部で46文字）</text><rect x="64" y="196" width="79" height="74" rx="14" fill="#FFFFFF" stroke="#C9D8DC" stroke-width="3"/><text class="jp" x="103.5" y="243.8" text-anchor="middle" font-size="30" font-weight="700" fill="#2B3A42">あ</text><rect x="153" y="196" width="79" height="74" rx="14" fill="#FFFFFF" stroke="#C9D8DC" stroke-width="3"/><text class="jp" x="192.5" y="243.8" text-anchor="middle" font-size="30" font-weight="700" fill="#2B3A42">い</text><rect x="242" y="196" width="79" height="74" rx="14" fill="#FFFFFF" stroke="#C9D8DC" stroke-width="3"/><text class="jp" x="281.5" y="243.8" text-anchor="middle" font-size="30" font-weight="700" fill="#2B3A42">う</text><rect x="331" y="196" width="79" height="74" rx="14" fill="#FFFFFF" stroke="#C9D8DC" stroke-width="3"/><text class="jp" x="370.5" y="243.8" text-anchor="middle" font-size="30" font-weight="700" fill="#2B3A42">え</text><rect x="420" y="196" width="79" height="74" rx="14" fill="#FFFFFF" stroke="#C9D8DC" stroke-width="3"/><text class="jp" x="459.5" y="243.8" text-anchor="middle" font-size="30" font-weight="700" fill="#2B3A42">お</text><rect x="509" y="196" width="79" height="74" rx="14" fill="#FFFFFF" stroke="#C9D8DC" stroke-width="3"/><text class="jp" x="548.5" y="243.8" text-anchor="middle" font-size="30" font-weight="700" fill="#2B3A42">か</text><rect x="598" y="196" width="79" height="74" rx="14" fill="#FFFFFF" stroke="#C9D8DC" stroke-width="3"/><text class="jp" x="637.5" y="243.8" text-anchor="middle" font-size="30" font-weight="700" fill="#2B3A42">き</text><rect x="687" y="196" width="79" height="74" rx="14" fill="#FFFFFF" stroke="#C9D8DC" stroke-width="3"/><text class="jp" x="726.5" y="243.8" text-anchor="middle" font-size="30" font-weight="700" fill="#2B3A42">く</text><rect x="776" y="196" width="79" height="74" rx="14" fill="#FFFFFF" stroke="#C9D8DC" stroke-width="3"/><text class="jp" x="815.5" y="243.8" text-anchor="middle" font-size="30" font-weight="700" fill="#2B3A42">け</text><rect x="865" y="196" width="79" height="74" rx="14" fill="#FFFFFF" stroke="#C9D8DC" stroke-width="3"/><text class="jp" x="904.5" y="243.8" text-anchor="middle" font-size="30" font-weight="700" fill="#2B3A42">こ</text><rect x="954" y="196" width="79" height="74" rx="14" fill="#FFFFFF" stroke="#C9D8DC" stroke-width="3"/><text class="jp" x="993.5" y="243.8" text-anchor="middle" font-size="30" font-weight="700" fill="#2B3A42">さ</text><rect x="1043" y="196" width="79" height="74" rx="14" fill="#FFFFFF" stroke="#C9D8DC" stroke-width="3"/><text class="jp" x="1082.5" y="243.8" text-anchor="middle" font-size="30" font-weight="700" fill="#2B3A42">し</text><rect x="1132" y="196" width="79" height="74" rx="14" fill="#FFFFFF" stroke="#C9D8DC" stroke-width="3"/><text class="jp" x="1171.5" y="243.8" text-anchor="middle" font-size="30" font-weight="700" fill="#2B3A42">す</text><rect x="1221" y="196" width="79" height="74" rx="14" fill="#FFFFFF" stroke="#C9D8DC" stroke-width="3"/><text class="jp" x="1260.5" y="243.8" text-anchor="middle" font-size="30" font-weight="700" fill="#2B3A42">せ</text><rect x="1310" y="196" width="79" height="74" rx="14" fill="#FFFFFF" stroke="#C9D8DC" stroke-width="3"/><text class="jp" x="1349.5" y="243.8" text-anchor="middle" font-size="30" font-weight="700" fill="#2B3A42">そ</text><rect x="1399" y="196" width="79" height="74" rx="14" fill="#FFFFFF" stroke="#C9D8DC" stroke-width="3"/><text class="jp" x="1438.5" y="243.8" text-anchor="middle" font-size="30" font-weight="700" fill="#2B3A42">た</text><rect x="1488" y="196" width="79" height="74" rx="14" fill="#FFFFFF" stroke="#C9D8DC" stroke-width="3"/><text class="jp" x="1527.5" y="243.8" text-anchor="middle" font-size="30" font-weight="700" fill="#2B3A42">ち</text><rect x="1577" y="196" width="79" height="74" rx="14" fill="#FFFFFF" stroke="#C9D8DC" stroke-width="3"/><text class="jp" x="1616.5" y="243.8" text-anchor="middle" font-size="30" font-weight="700" fill="#2B3A42">つ</text><rect x="1666" y="196" width="79" height="74" rx="14" fill="#FFFFFF" stroke="#C9D8DC" stroke-width="3"/><text class="jp" x="1705.5" y="243.8" text-anchor="middle" font-size="30" font-weight="700" fill="#2B3A42">て</text><rect x="1755" y="196" width="79" height="74" rx="14" fill="#FFFFFF" stroke="#C9D8DC" stroke-width="3"/><text class="jp" x="1794.5" y="243.8" text-anchor="middle" font-size="30" font-weight="700" fill="#2B3A42">と</text><text class="jp cap" x="64" y="308">… この順番で「ん」まで続きます</text><text class="jp cap" x="64" y="376">例：鍵が 2 のとき</text><rect x="64" y="400" width="116" height="116" rx="21" fill="#FFFFFF" stroke="#C9D8DC" stroke-width="3"/><text class="jp" x="122.0" y="476.72" text-anchor="middle" font-size="52" font-weight="700" fill="#2B3A42">ね</text><path d="M200,458.0 H340" stroke="#FF7757" stroke-width="6" fill="none"/><path d="M366,458.0 L338,442.0 L338,474.0 Z" fill="#FF7757"/><text class="jp c" x="280" y="434.0" text-anchor="middle">+2</text><rect x="378" y="400" width="116" height="116" rx="21" fill="#FFF3D6" stroke="#FFC93C" stroke-width="3"/><text class="jp" x="436.0" y="476.72" text-anchor="middle" font-size="52" font-weight="700" fill="#2B3A42">は</text><rect x="534" y="400" width="116" height="116" rx="21" fill="#FFFFFF" stroke="#C9D8DC" stroke-width="3"/><text class="jp" x="592.0" y="476.72" text-anchor="middle" font-size="52" font-weight="700" fill="#2B3A42">こ</text><path d="M670,458.0 H810" stroke="#FF7757" stroke-width="6" fill="none"/><path d="M836,458.0 L808,442.0 L808,474.0 Z" fill="#FF7757"/><text class="jp c" x="750" y="434.0" text-anchor="middle">+2</text><rect x="848" y="400" width="116" height="116" rx="21" fill="#FFF3D6" stroke="#FFC93C" stroke-width="3"/><text class="jp" x="906.0" y="476.72" text-anchor="middle" font-size="52" font-weight="700" fill="#2B3A42">し</text><text class="jp sub" x="64" y="568">「ねこ」が「はし」になります</text><rect x="1024" y="368" width="832" height="252" rx="26" fill="#FFF1EC" stroke="#FF7757" stroke-width="4"/><text class="jp lead" x="1058" y="424">鍵 ＝ ずらす数</text><text class="jp sub" x="1058" y="470">この例では「2」が鍵です。</text><text class="jp sub" x="1058" y="512">暗号文を作るときは進め、</text><text class="jp sub" x="1058" y="550">解くときは同じ数だけ戻します。</text><text class="jp c" x="1058" y="596">表の端は輪っか：「を」＋2 →「あ」</text><rect x="64" y="692" width="1792" height="314" rx="26" fill="#F0FBFB" stroke="#00777A" stroke-width="4"/><text class="jp lead" x="98" y="742">解き方</text><circle cx="114" cy="791" r="19" fill="#2B3A42"/><text class="jp stepn" x="114" y="800" text-anchor="middle">1</text><text class="jp step" x="146" y="800">1文字だけ選んで、1つずつ戻していく（表を左へたどる）</text><circle cx="114" cy="853" r="19" fill="#2B3A42"/><text class="jp stepn" x="114" y="862" text-anchor="middle">2</text><text class="jp step" x="146" y="862">意味のある言葉に見えたら、その「ずらした数」が鍵</text><circle cx="114" cy="915" r="19" fill="#2B3A42"/><text class="jp stepn" x="114" y="924" text-anchor="middle">3</text><text class="jp step" x="146" y="924">同じ鍵を使って、残りの文字も全部戻す</text><circle cx="114" cy="977" r="19" fill="#2B3A42"/><text class="jp stepn" x="114" y="986" text-anchor="middle">4</text><text class="jp step" x="146" y="986">全部つながって意味が通れば、解読成功</text></svg>
